<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>AgentRMC</title>
<style>
  :root{
    --bg:#0b0e14; --card:#121722; --card2:#161d2a;
    --line:rgba(255,255,255,.07); --text:#e6edf3; --muted:#8b949e;
    --blue:#4f8cff; --purple:#7c5cff; --green:#3fb950;
    --orange:#d29922; --red:#f85149;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    font-family:system-ui,-apple-system,"Segoe UI","Microsoft YaHei",sans-serif;
    background:var(--bg); color:var(--text); overflow:hidden;
    -webkit-font-smoothing:antialiased;
  }
  body::before{
    content:''; position:fixed; inset:0; pointer-events:none;
    background:
      radial-gradient(600px 300px at 12% -5%, rgba(79,140,255,.14), transparent 70%),
      radial-gradient(500px 280px at 95% 105%, rgba(124,92,255,.12), transparent 70%);
  }
  .app{height:100%;display:flex;flex-direction:column;position:relative}

  /* 标题栏 */
  .titlebar{
    height:46px;flex:0 0 46px;display:flex;align-items:center;gap:14px;
    padding:0 8px 0 18px;border-bottom:1px solid var(--line);
    background:rgba(13,17,26,.72);backdrop-filter:blur(18px);
  }
  .brand{display:flex;align-items:center;gap:9px;font-weight:650;font-size:14px;letter-spacing:.2px}
  .logo{
    width:18px;height:18px;border-radius:6px;
    background:linear-gradient(135deg,var(--blue),var(--purple));
    box-shadow:0 0 14px rgba(79,140,255,.5);
  }
  .pills{display:flex;gap:8px;margin-left:auto;margin-right:6px}
  .pill{
    display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--muted);
    padding:4px 10px;border-radius:999px;background:rgba(255,255,255,.045);
    border:1px solid var(--line);white-space:nowrap;
  }
  .pill i{width:6px;height:6px;border-radius:50%;background:#4b5563;display:block}
  .pill.on i{background:var(--green);box-shadow:0 0 8px var(--green)}
  .pill.on{color:#b9f6c6}
  .win-btns{display:none}
  .win-btns button{
    width:34px;height:30px;border:0;border-radius:7px;background:transparent;
    color:var(--muted);font-size:13px;cursor:pointer;transition:.15s;
  }
  .win-btns button:hover{background:rgba(255,255,255,.08);color:var(--text)}
  .win-btns button.close:hover{background:var(--red);color:#fff}

  main{flex:1;display:grid;grid-template-columns:392px 1fr;gap:14px;padding:14px;min-height:0}

  .left{display:flex;flex-direction:column;gap:12px;min-height:0}
  .card{
    background:linear-gradient(180deg,var(--card),var(--card2));
    border:1px solid var(--line);border-radius:16px;
    box-shadow:0 8px 28px rgba(0,0,0,.32), inset 0 1px 0 rgba(255,255,255,.035);
  }
  .card-title{
    font-size:11px;color:var(--muted);letter-spacing:.9px;text-transform:uppercase;
    padding:13px 16px 0;font-weight:600;display:flex;justify-content:space-between;
  }

  .voice-card{flex:1;display:flex;flex-direction:column;padding-bottom:14px;min-height:0}
  #wave{width:100%;height:118px;display:block;margin-top:6px}
  .result{
    margin:0 16px;padding:14px 16px;min-height:64px;border-radius:12px;
    background:rgba(255,255,255,.035);border:1px solid var(--line);
    font-size:16px;line-height:1.55;word-break:break-word;
    display:flex;align-items:center;transition:.2s;
  }
  .result.idle{color:#5b6472;font-size:13px}
  .result.live{border-color:rgba(248,81,73,.45);background:rgba(248,81,73,.06)}
  .result.done{border-color:rgba(63,185,80,.35);background:rgba(63,185,80,.06)}
  .result-meta{margin:8px 18px 0;font-size:11.5px;color:var(--muted);height:16px}

  .controls{display:flex;gap:9px}
  .controls button{
    flex:1;height:42px;border-radius:12px;border:1px solid var(--line);
    font-size:13px;font-weight:600;cursor:pointer;transition:.18s;
    font-family:inherit;
  }
  .primary{
    background:linear-gradient(135deg,var(--blue),var(--purple));color:#fff;border:0;
    box-shadow:0 6px 20px rgba(79,140,255,.32);
  }
  .primary:hover{filter:brightness(1.1);transform:translateY(-1px)}
  .primary.stop{background:linear-gradient(135deg,#e5484d,#b4232a);box-shadow:0 6px 20px rgba(229,72,77,.3)}
  .ghost{background:rgba(255,255,255,.05);color:var(--text)}
  .ghost:hover{background:rgba(255,255,255,.09)}
  .ghost:active{transform:scale(.98)}

  .info-card{padding-bottom:10px;flex:0 0 auto}
  .row{display:flex;justify-content:space-between;gap:10px;padding:7px 16px;font-size:12px}
  .row span{color:var(--muted)}
  .row b{font-weight:500;color:#c9d1d9;max-width:210px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

  .right{min-height:0;display:flex}
  .log-card{flex:1;display:flex;flex-direction:column;min-height:0}
  .log{flex:1;overflow-y:auto;padding:10px 12px 14px;display:flex;flex-direction:column;gap:5px}
  .log::-webkit-scrollbar{width:8px}
  .log::-webkit-scrollbar-thumb{background:rgba(255,255,255,.09);border-radius:4px}
  .log::-webkit-scrollbar-thumb:hover{background:rgba(255,255,255,.16)}

  .ev{
    display:flex;align-items:center;gap:10px;padding:8px 12px;border-radius:10px;
    background:rgba(255,255,255,.028);border-left:2px solid transparent;
    font-size:12.5px;animation:slide .22s ease;
  }
  @keyframes slide{from{opacity:0;transform:translateX(-6px)}to{opacity:1;transform:none}}
  .ev .ico{width:16px;text-align:center;font-size:12px;flex:0 0 16px}
  .ev .body{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .ev .body em{font-style:normal;color:var(--muted);font-size:11.5px;margin-left:6px}
  .ev .t{color:#5b6472;font-size:11px;font-variant-numeric:tabular-nums;flex:0 0 auto}
  .ev.key{border-left-color:var(--blue)}
  .ev.text{border-left-color:var(--green);background:rgba(63,185,80,.07)}
  .ev.action{border-left-color:var(--orange);background:rgba(210,153,34,.07)}
  .ev.paste{border-left-color:var(--purple)}
  .ev.error{border-left-color:var(--red);background:rgba(248,81,73,.08)}
  .ev.status,.ev.log{border-left-color:#30363d;color:var(--muted)}
  .ev.voice_start{border-left-color:var(--red);background:rgba(248,81,73,.07)}
  .ev.voice_stop{border-left-color:#30363d}

  .empty{color:#3d4550;font-size:12.5px;text-align:center;padding:34px 0}
</style>
</head>
<body>
<div class="app">
  <header class="titlebar">
    <div class="brand"><span class="logo"></span>AgentRMC</div>
    <div class="pills">
      <span class="pill" id="pill-status"><i></i><span>已停止</span></span>
      <span class="pill" id="pill-battery">--%</span>
      <span class="pill" id="pill-profile">default</span>
    </div>
    <div class="win-btns">
      <button onclick="minimize()" title="最小化">─</button>
      <button class="close" onclick="closeApp()" title="关闭">✕</button>
    </div>
  </header>

  <main>
    <section class="left">
      <div class="card voice-card">
        <div class="card-title"><span>语音</span><span id="rec-indicator"></span></div>
        <canvas id="wave"></canvas>
        <div class="result idle" id="result">按住遥控器语音键说话</div>
        <div class="result-meta" id="meta"></div>
      </div>

      <div class="controls">
        <button id="btn-toggle" class="primary">开始监听</button>
        <button id="btn-test" class="ghost">测试麦克风</button>
      </div>

      <div class="card info-card">
        <div class="row"><span>设备</span><b id="i-device">-</b></div>
        <div class="row"><span>语音键</span><b id="i-vk">-</b></div>
        <div class="row"><span>模型</span><b id="i-model">-</b></div>
        <div class="row"><span>指令</span><b id="i-rules">-</b></div>
      </div>
    </section>

    <section class="right">
      <div class="card log-card">
        <div class="card-title"><span>事件流</span><span id="log-count"></span></div>
        <div class="log" id="log"><div class="empty">等待事件…</div></div>
      </div>
    </section>
  </main>
</div>

<script>
const $ = id => document.getElementById(id);
let seq = 0, running = false, lastState = 'idle', waveData = [], rafId = null;

const ICONS = {
  key:'⌨', text:'💬', action:'⚡', paste:'📋', status:'•',
  error:'⚠', log:'·', voice_start:'●', voice_stop:'■', battery:'🔋'
};

/* ---------- 波形 ---------- */
const cvs = $('wave'), ctx = cvs.getContext('2d');
function fitCanvas(){
  const dpr = window.devicePixelRatio || 1;
  const w = cvs.clientWidth, h = 118;
  cvs.width = w * dpr; cvs.height = h * dpr;
  ctx.setTransform(dpr,0,0,dpr,0,0);
}
window.addEventListener('resize', fitCanvas);

function drawWave(){
  const w = cvs.clientWidth, h = 118, mid = h/2;
  ctx.clearRect(0,0,w,h);

  // 中线
  ctx.strokeStyle = 'rgba(255,255,255,.05)';
  ctx.beginPath(); ctx.moveTo(0,mid); ctx.lineTo(w,mid); ctx.stroke();

  const n = 72, gap = 2, bw = Math.max(2,(w - gap*(n-1))/n);
  const active = running && lastState === 'recording';
  for(let i=0;i<n;i++){
    const v = waveData[i] || 0;
    const amp = Math.min(1, v * 9);
    const bh = Math.max(2, amp * (h*0.42));
    const x = i * (bw + gap);
    const g = ctx.createLinearGradient(0, mid-bh, 0, mid+bh);
    if(active){
      g.addColorStop(0,'rgba(248,81,73,.95)');
      g.addColorStop(1,'rgba(248,81,73,.35)');
    } else {
      g.addColorStop(0,'rgba(79,140,255,.55)');
      g.addColorStop(1,'rgba(124,92,255,.18)');
    }
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.roundRect(x, mid-bh, bw, bh*2, bw/2);
    ctx.fill();
  }
}

function pushLevel(v){
  waveData.push(v);
  if(waveData.length > 72) waveData.shift();
}

function loop(){
  if(!running) pushLevel(0);
  drawWave();
  rafId = requestAnimationFrame(loop);
}

/* ---------- 渲染 ---------- */
function addEvent(e){
  const log = $('log');
  const empty = log.querySelector('.empty');
  if(empty) empty.remove();

  const div = document.createElement('div');
  div.className = 'ev ' + e.kind;

  let body = '';
  if(e.kind === 'key')        body = `${e.name}<em>${e.profile} · ${e.detail||''}</em>`;
  else if(e.kind === 'text')  body = e.text ? `「${e.text}」<em>${e.cost}s</em>` : `<em>${e.note||'空'}</em>`;
  else if(e.kind === 'action')body = `执行指令 ${e.text}<em>${e.kind||''}</em>`;
  else if(e.kind === 'paste') body = `已粘贴到前台窗口`;
  else if(e.kind === 'voice_start') body = `开始录音`;
  else if(e.kind === 'voice_stop')  body = e.dur ? `录音结束 ${e.dur}s` : (e.text||'');
  else if(e.kind === 'battery')     body = `电量 ${e.value}%`;
  else body = e.text || '';

  div.innerHTML = `<span class="ico">${ICONS[e.kind]||'·'}</span>
                   <span class="body">${body}</span>
                   <span class="t">${e.ts||''}</span>`;
  log.appendChild(div);
  while(log.children.length > 220) log.removeChild(log.firstChild);
  log.scrollTop = log.scrollHeight;

  $('log-count').textContent = log.children.length;

  if(e.kind === 'text' && e.text){
    const r = $('result');
    r.className = 'result done';
    r.textContent = e.text;
    $('meta').textContent = `识别耗时 ${e.cost}s`;
  }
  if(e.kind === 'voice_start'){
    const r = $('result');
    r.className = 'result live';
    r.textContent = '正在聆听…';
    $('meta').textContent = '';
    $('rec-indicator').textContent = '● REC';
    $('rec-indicator').style.color = 'var(--red)';
  }
  if(e.kind === 'voice_stop'){
    $('rec-indicator').textContent = '';
  }
}

function setRunning(on){
  running = on;
  const pill = $('pill-status');
  pill.classList.toggle('on', on);
  pill.querySelector('span').textContent = on ? '监听中' : '已停止';
  const btn = $('btn-toggle');
  btn.textContent = on ? '停止监听' : '开始监听';
  btn.classList.toggle('stop', on);
}

function setState(st){
  if(st !== lastState){
    lastState = st;
    if(st === 'recording'){
      $('result').className = 'result live';
      $('result').textContent = '正在聆听…';
    }
  }
}

/* ---------- 轮询 ---------- */
async function tick(){
  try{
    const r = await pywebview.api.poll(seq);
    if(!r) return;
    seq = r.seq;
    r.events.forEach(addEvent);
    setState(r.state);
    pushLevel(r.level || 0);
    setRunning(r.running);
    $('pill-profile').textContent = r.profile;
    if(r.battery != null) $('pill-battery').textContent = r.battery + '%';
    if(r.state === 'recording'){
      $('meta').textContent = '松手后自动转写';
    }
  }catch(err){ /* 忽略瞬时错误 */ }
  setTimeout(tick, 70);
}

/* ---------- 初始化 ---------- */
async function init(){
  fitCanvas();
  loop();
  const snap = await pywebview.api.snapshot();
  $('i-device').textContent = snap.device;
  $('i-device').title = snap.device;
  $('i-vk').textContent = `0x${snap.voice_vk.toString(16).toUpperCase()}`;
  $('i-model').textContent = 'whisper ' + snap.model;
  $('i-rules').textContent = snap.rules + ' 条';
  tick();
}

$('btn-toggle').onclick = async () => {
  if(running){ await pywebview.api.stop(); setRunning(false); }
  else { const r = await pywebview.api.start(); if(r && r.ok) setRunning(true); }
};
$('btn-test').onclick = async () => {
  await pywebview.api.test_mic(4);
  $('result').className = 'result idle';
  $('result').textContent = '录音测试中，请对着麦克风说话…';
};
function minimize(){ pywebview.api.minimize(); }
function closeApp(){ pywebview.api.close(); }

window.addEventListener('pywebviewready', init);
</script>
</body>
</html>
