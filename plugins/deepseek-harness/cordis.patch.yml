# AgentRMC 桌宠联动（DeepSeek Harness 版）。
#
# 这一行把 Host 插件挂进当前 profile：装上之后，DSH 等授权 / 等选方案 / 一轮结束
# 都会通知本机 AgentRMC 桌宠，同时给模型加 pet_notify / pet_speak / pet_state /
# pet_work_update 四个工具。
#
# config 是「替换」不是深合并：patch 里写出一个字段，其余字段走插件内置缺省值
# （见 index.js 的 DEFAULTS 与 README 的配置表）。全部字段都可省略。
- insert:
    - id: agentrmc-bridge
      name: '@local/agentrmc-bridge'
      config:
        agentName: DeepSeek Harness
        raiseExe: DeepSeek Harness.exe
        # B3 授权内联答（用户 2026-11-14 22:09 明确开启）：插件成为 approval/request
        # 独占应答者，授权改由 RMC 聊天页允许/拒绝，桌面 Web UI 授权卡不再弹。
        # 2026-11-16 修：这个应答者原来没 prepend，排在 GUI 转发器后面 → 插件从没
        # 真 hold 住，卡片照样弹、点「允许」却找不到 waiter（看着就是「点了没反应」）。
        # 现在与提问同构：prepend（抢链首）+ 活性门（桌宠不在线让给 GUI）+
        # approvalHoldTimeoutMs 兜底（到点放行给 GUI，不挂死工具调用）。
        approvalInline: true
        approvalHoldTimeoutMs: 180000
        # 提问独占（2026-11-16 开启）：插件用 { prepend: true } 抢在桌面 GUI 的瀑布
        # 转发器前面 hold 住 user-questions/request，桌宠/聊天页选完 → 答案**当轮**
        # 回给 ask_user_question（不再是「排队到下一轮的用户消息」）。旧注释说的
        # 「挂 global scope 进不了 agent scoped 瀑布」是误诊：未打 scope 标签的
        # 监听器一定放行，抢不到只是注册顺序（GUI 转发器先轮到且不再 next()）。
        # 两道安全门：桌宠不在线时不 hold（让 GUI 弹卡）；questionHoldTimeoutMs
        # 到点放行给 GUI，绝不把工具调用挂死。
        questionInline: true
        questionHoldTimeoutMs: 180000
